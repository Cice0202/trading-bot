name: Krypto-Scanner
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: pip install requests

      - name: Scanner laufen lassen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
          MANUELL: ${{ github.event_name == 'workflow_dispatch' }}
        run: python bot.py

      - name: Zustand speichern
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Zustand aktualisiert"
          git push
